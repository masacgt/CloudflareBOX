name: CFBox icon transparency one-shot

on:
  push:
    paths:
      - .github/workflows/cfbox-icon-transparent-once.yml

permissions:
  contents: write

jobs:
  update-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Make outer white background transparent
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image

          src = Path("assets/cfbox-icon.png")
          android = Path("android/app/src/main/res/drawable-nodpi/cfbox_icon.png")
          ico = Path("assets/cfbox-icon.ico")

          im = Image.open(src).convert("RGBA")
          w, h = im.size
          px = im.load()
          seen = bytearray(w * h)
          q = deque()

          def is_outer_light(x, y):
              r, g, b, _ = px[x, y]
              return r >= 220 and g >= 220 and b >= 220

          def add(x, y):
              i = y * w + x
              if not seen[i] and is_outer_light(x, y):
                  seen[i] = 1
                  q.append((x, y))

          for x in range(w):
              add(x, 0)
              add(x, h - 1)
          for y in range(h):
              add(0, y)
              add(w - 1, y)

          changed = 0
          while q:
              x, y = q.popleft()
              r, g, b, a = px[x, y]
              if a:
                  px[x, y] = (r, g, b, 0)
                  changed += 1
              if x:
                  add(x - 1, y)
              if x + 1 < w:
                  add(x + 1, y)
              if y:
                  add(x, y - 1)
              if y + 1 < h:
                  add(x, y + 1)

          if px[0, 0][3] != 0:
              raise SystemExit("corner is not transparent")
          if px[w // 2, h // 2][3] != 255:
              raise SystemExit("center unexpectedly became transparent")

          im.save(src, format="PNG", optimize=True)
          android.write_bytes(src.read_bytes())

          icon_im = im.resize((256, 256), Image.Resampling.LANCZOS)
          icon_im.save(ico, format="ICO", sizes=[(256, 256)])

          check = Image.open(ico)
          check.load()
          if check.size != (256, 256):
              raise SystemExit(f"unexpected ICO size: {check.size}")

          print(f"changed={changed}")
          print(f"png={im.size}, ico={check.size}")
          print(f"corner_alpha={px[0,0][3]}, center_alpha={px[w//2,h//2][3]}")
          PY

      - name: Commit generated icon assets and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/cfbox-icon-transparent-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cfbox-icon.png assets/cfbox-icon.ico android/app/src/main/res/drawable-nodpi/cfbox_icon.png .github/workflows/cfbox-icon-transparent-once.yml
          git diff --cached --check
          git commit -m "Make CFBox icon background transparent"
          git push origin HEAD:main
