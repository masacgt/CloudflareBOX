name: Build personal v0.5

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-v0.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package.json
      - run: npm install
        working-directory: cloudflare
      - run: npm run typecheck
        working-directory: cloudflare
      - run: npm test
        working-directory: cloudflare
      - run: npm run build:bundle
        working-directory: cloudflare
      - uses: actions/upload-artifact@v4
        with:
          name: personal-v0.5-worker
          path: cloudflare/dist/cloudflarebox-worker.mjs

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-v0.5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        working-directory: android
      - run: ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: personal-v0.5-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    needs: worker
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-v0.5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish .\src\CloudflareBox.Service\CloudflareBox.Service.csproj --configuration Release --runtime win-x64 --self-contained true --output .\package\service
        working-directory: win11
      - run: dotnet publish .\src\CloudflareBox.Tray\CloudflareBox.Tray.csproj --configuration Release --runtime win-x64 --self-contained true --output .\package\tray
        working-directory: win11
      - uses: actions/download-artifact@v4
        with:
          name: personal-v0.5-worker
          path: win11/package/worker
      - name: Assemble personal v0.5 package
        shell: pwsh
        working-directory: win11
        env:
          OAUTH_CLIENT_ID: ${{ vars.CLOUDFLAREBOX_OAUTH_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OAUTH_CLIENT_ID)) {
            throw "Repository variable CLOUDFLAREBOX_OAUTH_CLIENT_ID is required."
          }
          Copy-Item .\installer\install.ps1 .\package\install.ps1 -Force
          Copy-Item .\installer\uninstall.ps1 .\package\uninstall.ps1 -Force
          Copy-Item .\installer\Install-CloudflareBOX.cmd .\package\Install-CloudflareBOX.cmd -Force
          Copy-Item .\installer\START-HERE.txt .\package\START-HERE.txt -Force
          Set-Content -Path .\package\oauth-client-id.txt -Value $env:OAUTH_CLIENT_ID -NoNewline -Encoding utf8
          Compress-Archive -Path .\package\* -DestinationPath .\CFBox-personal-v0.5-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: personal-v0.5-windows
          path: win11/CFBox-personal-v0.5-Windows.zip
