name: CloudflareBOX CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package.json
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:bundle
      - run: npx wrangler deploy --dry-run --outdir dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflarebox-worker
          path: cloudflare/dist/cloudflarebox-worker.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore .\CloudflareBox.slnx
        working-directory: win11
      - run: dotnet build .\CloudflareBox.slnx --configuration Release --no-restore
        working-directory: win11
      - run: dotnet run --project .\tests\CloudflareBox.Core.Tests\CloudflareBox.Core.Tests.csproj --configuration Release
        working-directory: win11

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        working-directory: android
      - run: ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflarebox-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows-package:
    needs: [worker, windows, android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate installer entrypoint under Restricted policy
        shell: cmd
        run: |
          > "%RUNNER_TEMP%\cloudflarebox-policy-test.ps1" echo Write-Output 'restricted-policy-ok'
          set "CLOUDFLAREBOX_INSTALL_SCRIPT=%RUNNER_TEMP%\cloudflarebox-policy-test.ps1"
          powershell.exe -NoProfile -ExecutionPolicy Restricted -Command "$script = [ScriptBlock]::Create((Get-Content -Raw -LiteralPath $env:CLOUDFLAREBOX_INSTALL_SCRIPT)); & $script"
      - name: Validate installer PowerShell syntax
        shell: pwsh
        working-directory: win11
        run: |
          foreach ($script in @('.\installer\install.ps1', '.\installer\uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $messages = ($errors | ForEach-Object { $_.Message }) -join '; '
              throw "${script}: $messages"
            }
          }
      - name: Validate distribution OAuth client
        shell: pwsh
        env:
          OAUTH_CLIENT_ID: ${{ vars.CLOUDFLAREBOX_OAUTH_CLIENT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OAUTH_CLIENT_ID)) {
            throw "Repository variable CLOUDFLAREBOX_OAUTH_CLIENT_ID is required for distributable Windows packages. See docs/OAUTH_SETUP.md."
          }
          Write-Host "Cloudflare OAuth public Client ID is configured."
      - run: dotnet publish .\src\CloudflareBox.Service\CloudflareBox.Service.csproj --configuration Release --runtime win-x64 --self-contained true --output .\package\service
        working-directory: win11
      - run: dotnet publish .\src\CloudflareBox.Tray\CloudflareBox.Tray.csproj --configuration Release --runtime win-x64 --self-contained true --output .\package\tray
        working-directory: win11
      - uses: actions/download-artifact@v4
        with:
          name: cloudflarebox-worker
          path: win11/package/worker
      - name: Assemble and verify Windows package
        shell: pwsh
        working-directory: win11
        env:
          OAUTH_CLIENT_ID: ${{ vars.CLOUDFLAREBOX_OAUTH_CLIENT_ID }}
        run: |
          Copy-Item .\installer\install.ps1 .\package\install.ps1 -Force
          Copy-Item .\installer\uninstall.ps1 .\package\uninstall.ps1 -Force
          Copy-Item .\installer\Install-CloudflareBOX.cmd .\package\Install-CloudflareBOX.cmd -Force
          Copy-Item .\installer\START-HERE.txt .\package\START-HERE.txt -Force
          Set-Content -Path .\package\oauth-client-id.txt -Value $env:OAUTH_CLIENT_ID -NoNewline -Encoding utf8
          $required = @(
            '.\package\service\CloudflareBox.Service.exe',
            '.\package\service\coreclr.dll',
            '.\package\tray\CloudflareBox.Tray.exe',
            '.\package\tray\coreclr.dll',
            '.\package\worker\cloudflarebox-worker.mjs',
            '.\package\install.ps1',
            '.\package\uninstall.ps1',
            '.\package\Install-CloudflareBOX.cmd',
            '.\package\START-HERE.txt',
            '.\package\oauth-client-id.txt'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing Windows package item: $path" }
          }
          Compress-Archive -Path .\package\* -DestinationPath .\CloudflareBOX-Windows.zip -Force
      - name: Build CFBox Windows installer
        shell: pwsh
        working-directory: win11
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler was not found: $iscc" }
          & $iscc ".\installer\CFBox.iss" /DMyAppVersion=ci
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path ".\installer-output\CFBox-Setup.exe")) { throw "CFBox-Setup.exe was not created." }
      - uses: actions/upload-artifact@v4
        with:
          name: cloudflarebox-windows
          path: |
            win11/CloudflareBOX-Windows.zip
            win11/installer-output/CFBox-Setup.exe
